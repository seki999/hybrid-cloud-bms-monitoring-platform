apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: bms-web-app}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Ingress, name: bms-web-app}
    patch: |-
      - op: remove
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
