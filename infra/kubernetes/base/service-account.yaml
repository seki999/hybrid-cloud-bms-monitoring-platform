apiVersion: v1
kind: ServiceAccount
metadata:
  name: bms-runtime
  namespace: bms-monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bms-read-config
  namespace: bms-monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bms-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bms-read-config
  namespace: bms-monitoring
subjects:
  - kind: ServiceAccount
    name: bms-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bms-read-config
