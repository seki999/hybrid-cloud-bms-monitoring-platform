# 为 BMS 工作负载提供独立 ServiceAccount，便于后续按最小权限绑定云身份或 Kubernetes 权限。
# 基础清单不授予额外集群角色，避免应用默认继承不必要权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bms-runtime
  namespace: bms-monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bms-read-config
  namespace: bms-monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bms-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bms-read-config
  namespace: bms-monitoring
subjects:
  - kind: ServiceAccount
    name: bms-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bms-read-config
