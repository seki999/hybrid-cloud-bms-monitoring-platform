# 学习环境占位值。生产环境请删除此文件并由 OCI Vault/External Secrets 创建同名 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: bms-secrets
  namespace: bms-monitoring
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  BMS_INGEST_API_KEY: replace-me
  BMS_ADMIN_PASSWORD: replace-me
  BMS_OPERATOR_PASSWORD: replace-me
  BMS_VIEWER_PASSWORD: replace-me
