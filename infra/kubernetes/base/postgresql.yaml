# 部署本地/验证用途的 PostgreSQL 服务与持久化工作负载，为 BMS 应用提供关系数据库。
# 生产环境应使用受管数据库和外部秘密，本清单中的示例值不得直接复用。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: bms-monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: bms-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgresql}
  template:
    metadata:
      labels: {app: postgresql}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16.8-alpine
          ports:
            - {name: postgresql, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: bms}
            - {name: POSTGRES_USER, value: bms}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: bms-secrets, key: POSTGRES_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, bms, -d, bms]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, bms, -d, bms]}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgresql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: bms-monitoring
spec:
  selector: {app: postgresql}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
