# 部署仅供非生产环境使用的邮件捕获器，让通知流程可验证而不会向真实收件人发信。
# Web UI 和 SMTP 端口仅在开发边界内开放，生产覆盖层不应包含该组件。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: bms-monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: web, containerPort: 8025}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: mailhog, namespace: bms-monitoring}
spec:
  selector: {app: mailhog}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: web, port: 8025, targetPort: web}
