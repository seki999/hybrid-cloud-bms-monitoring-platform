# 同一不可变镜像由 BMS_COMPONENT 与接收器开关承担五种逻辑角色；便于独立扩缩、滚动与故障隔离。
apiVersion: apps/v1
kind: Deployment
metadata: {name: bms-web-app, namespace: bms-monitoring}
spec:
  replicas: 2
  selector: {matchLabels: {app: bms-web-app}}
  template:
    metadata: {labels: {app: bms-web-app, component: web}}
    spec:
      serviceAccountName: bms-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: bms
          image: hybrid-cloud-bms-monitoring-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - {configMapRef: {name: bms-config}}
            - {secretRef: {name: bms-secrets}}
          env:
            - {name: BMS_COMPONENT, value: web}
            - {name: SYSLOG_RECEIVER_ENABLED, value: "false"}
            - {name: SNMP_RECEIVER_ENABLED, value: "false"}
            - {name: BMS_ALERT_SCHEDULER_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: syslog-receiver, namespace: bms-monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: syslog-receiver}}
  template:
    metadata: {labels: {app: syslog-receiver, component: receiver}}
    spec:
      serviceAccountName: bms-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: bms
          image: hybrid-cloud-bms-monitoring-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: syslog-udp, containerPort: 5514, protocol: UDP}
            - {name: syslog-tcp, containerPort: 5514, protocol: TCP}
          env:
            - {name: BMS_COMPONENT, value: syslog-receiver}
            - {name: SYSLOG_RECEIVER_ENABLED, value: "true"}
            - {name: SNMP_RECEIVER_ENABLED, value: "false"}
            - {name: BMS_ALERT_SCHEDULER_ENABLED, value: "false"}
          envFrom:
            - {configMapRef: {name: bms-config}}
            - {secretRef: {name: bms-secrets}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 45, periodSeconds: 20}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 5, failureThreshold: 36}
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes: [{name: tmp, emptyDir: {}}]
---
