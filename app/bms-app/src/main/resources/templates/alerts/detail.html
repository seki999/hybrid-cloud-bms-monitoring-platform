<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'alerts')}">
<head><title>アラート詳細 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">ALERT LIFECYCLE</p><h1 th:text="${alert.title}">alert</h1><p class="lead" th:text="${alert.summary}">summary</p></div><div class="toolbar"><a class="btn btn-secondary" th:href="@{/alerts}">一覧へ</a><a sec:authorize="hasAnyRole('ADMIN','OPERATOR')" class="btn btn-primary" th:href="@{/alerts/{id}/confirm(id=${alert.id})}">確認操作</a></div></div>
  <div class="notice" th:if="${param.acknowledged}">アラートを確認済みにしました。</div><div class="notice" th:if="${param.closed}">アラートを終了しました。</div>
  <section class="panel"><div class="panel-head"><h2>継続障害情報</h2><span class="badge" th:classappend="${#strings.toLowerCase(alert.status.name())}" th:text="${alert.status}">CRITICAL</span></div><div class="panel-body"><div class="detail-grid"><div class="detail-item"><span class="detail-label">DEVICE</span><span class="detail-value" th:text="${alert.device.name}">device</span></div><div class="detail-item"><span class="detail-label">SEVERITY</span><span class="detail-value" th:text="${alert.severity}">critical</span></div><div class="detail-item"><span class="detail-label">EVENT COUNT</span><span class="detail-value" th:text="${alert.eventCount}">3</span></div><div class="detail-item"><span class="detail-label">初回発生</span><span class="detail-value" th:text="${#temporals.format(alert.firstOccurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</span></div><div class="detail-item"><span class="detail-label">最終発生</span><span class="detail-value" th:text="${#temporals.format(alert.lastOccurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</span></div><div class="detail-item"><span class="detail-label">確認者</span><span class="detail-value" th:text="${alert.acknowledgedBy != null ? alert.acknowledgedBy : '未確認'}">未確認</span></div></div></div></section>
  <section class="panel"><div class="panel-head"><h2>状態変更履歴</h2></div><div class="table-wrap"><table><thead><tr><th>日時</th><th>変更前</th><th>変更後</th><th>実行者</th><th>理由</th></tr></thead><tbody><tr th:each="item : ${history}"><td class="mono" th:text="${#temporals.format(item.createdAt, 'yyyy/MM/dd HH:mm:ss')}">date</td><td th:text="${item.fromStatus != null ? item.fromStatus : '-'}">-</td><td><span class="badge" th:classappend="${#strings.toLowerCase(item.toStatus.name())}" th:text="${item.toStatus}">status</span></td><td th:text="${item.actor}">system</td><td th:text="${item.reason}">reason</td></tr></tbody></table></div></section>
</main></body></html>
