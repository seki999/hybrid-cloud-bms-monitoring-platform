<!DOCTYPE html>
<!-- 告警列表页：突出严重度、生命周期状态和重复次数，使值班人员能够优先处理仍在活跃的高风险告警。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'alerts')}">
<head><title>アラート一覧 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">CONTINUOUS INCIDENTS</p><h1>アラート一覧</h1><p class="lead">複数 Event を集約した継続障害と対応状態</p></div><span class="badge critical">ACTION REQUIRED</span></div>
  <section class="panel"><div class="panel-head"><form class="toolbar" method="get"><div class="search"><input name="q" th:value="${q}" placeholder="アラートタイトルを検索"></div><button class="btn btn-secondary">検索</button></form><span class="subtle" th:text="${alerts.totalElements + ' 件'}">10件</span></div><div class="table-wrap"><table><thead><tr><th>最終発生</th><th>アラート</th><th>機器</th><th>級別</th><th>Event数</th><th>状態</th><th>確認者</th></tr></thead><tbody><tr th:each="alert : ${alerts.content}"><td class="mono" th:text="${#temporals.format(alert.lastOccurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</td><td><a class="cell-title" th:href="@{/alerts/{id}(id=${alert.id})}" th:text="${alert.title}">title</a><span class="cell-sub mono" th:text="${alert.alertKey}">key</span></td><td th:text="${alert.device.name}">device</td><td th:text="${alert.severity}">CRITICAL</td><td th:text="${alert.eventCount}">2</td><td><span class="badge" th:classappend="${#strings.toLowerCase(alert.status.name())}" th:text="${alert.status}">CRITICAL</span></td><td th:text="${alert.acknowledgedBy != null ? alert.acknowledgedBy : '-'}">-</td></tr></tbody></table></div><div class="pagination"><span class="subtle" th:text="${'ページ ' + (alerts.number + 1)}">1</span><div class="pagination-links"><a class="page-link" th:classappend="${alerts.first} ? 'disabled'" th:href="@{/alerts(q=${q},page=${alerts.number - 1})}">前へ</a><a class="page-link" th:classappend="${alerts.last} ? 'disabled'" th:href="@{/alerts(q=${q},page=${alerts.number + 1})}">次へ</a></div></div></section>
</main></body></html>
