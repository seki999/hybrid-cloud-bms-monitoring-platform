<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'devices')}">
<head><title>監視対象機器登録・編集 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">DEVICE CONFIGURATION</p><h1 th:text="${deviceId != null ? '監視対象機器編集' : '監視対象機器登録'}">監視対象機器編集</h1><p class="lead">入力値はサーバー側 Validation でも確認されます。</p></div><a class="btn btn-secondary" th:href="${deviceId != null ? '/devices/' + deviceId : '/devices'}">キャンセル</a></div>
  <form class="panel" th:object="${deviceForm}" th:action="${deviceId != null ? '/devices/' + deviceId : '/devices'}" method="post"><div class="panel-head"><h2>機器情報</h2><span class="badge maintenance">ADMIN ONLY</span></div><div class="panel-body">
    <div class="field-row"><div class="field"><label for="name">機器名 <span class="required">*</span></label><input class="control" id="name" th:field="*{name}" maxlength="80"><p class="field-error" th:errors="*{name}">error</p></div><div class="field"><label for="hostname">ホスト名 / IP <span class="required">*</span></label><input class="control mono" id="hostname" th:field="*{hostname}" maxlength="255"><p class="field-error" th:errors="*{hostname}">error</p></div></div>
    <div class="field-row"><div class="field"><label for="deviceType">機器種別 <span class="required">*</span></label><select class="control" id="deviceType" th:field="*{deviceType}"><option value="">選択してください</option><option th:each="type : ${deviceTypes}" th:value="${type}" th:text="${type}"></option></select><p class="field-error" th:errors="*{deviceType}">error</p></div><div class="field"><label for="status">状態 <span class="required">*</span></label><select class="control" id="status" th:field="*{status}"><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}"></option></select><p class="field-error" th:errors="*{status}">error</p></div></div>
    <div class="field-row"><div class="field"><label for="location">設置場所 <span class="required">*</span></label><input class="control" id="location" th:field="*{location}" maxlength="120"><p class="field-error" th:errors="*{location}">error</p></div><div class="field"><label for="vendor">ベンダー <span class="required">*</span></label><input class="control" id="vendor" th:field="*{vendor}" maxlength="80"><p class="field-error" th:errors="*{vendor}">error</p></div></div>
    <div class="field"><label for="description">説明</label><textarea class="control" id="description" th:field="*{description}" maxlength="500"></textarea><p class="field-error" th:errors="*{description}">error</p></div>
  </div><div class="panel-head"><span class="subtle">保存操作は監査ログに記録されます。</span><button class="btn btn-primary" type="submit">保存する</button></div></form>
</main></body></html>
