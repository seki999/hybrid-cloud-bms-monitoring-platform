<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'devices')}">
<head><title>監視対象機器詳細 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">DEVICE DETAIL</p><h1 th:text="${device.name}">東京エッジルーター01</h1><p class="lead" th:text="${device.description}">顧客VPNルーター</p></div><div class="toolbar"><a class="btn btn-secondary" th:href="@{/devices}">一覧へ</a><a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/devices/{id}/edit(id=${device.id})}">編集</a></div></div>
  <div class="notice" th:if="${param.saved}">機器情報を保存しました。</div>
  <section class="panel"><div class="panel-head"><h2>基本情報</h2><span class="badge" th:classappend="${#strings.toLowerCase(device.status.name())}" th:text="${device.status}">NORMAL</span></div><div class="panel-body"><div class="detail-grid">
    <div class="detail-item"><span class="detail-label">HOSTNAME / IP</span><span class="detail-value mono" th:text="${device.hostname}">10.0.0.1</span></div><div class="detail-item"><span class="detail-label">機器種別</span><span class="detail-value" th:text="${device.deviceType}">ROUTER</span></div><div class="detail-item"><span class="detail-label">ベンダー</span><span class="detail-value" th:text="${device.vendor}">Juniper</span></div><div class="detail-item"><span class="detail-label">設置場所</span><span class="detail-value" th:text="${device.location}">東京DC</span></div><div class="detail-item"><span class="detail-label">登録日時</span><span class="detail-value" th:text="${#temporals.format(device.createdAt, 'yyyy/MM/dd HH:mm:ss')}">2026</span></div><div class="detail-item"><span class="detail-label">最終更新</span><span class="detail-value" th:text="${#temporals.format(device.updatedAt, 'yyyy/MM/dd HH:mm:ss')}">2026</span></div>
  </div></div></section>
  <section class="panel"><div class="panel-head"><h2>監視対象</h2><span class="subtle" th:text="${targets.size() + ' 件'}">2 件</span></div><div class="table-wrap"><table><thead><tr><th>監視名</th><th>方式</th><th>宛先</th><th>OID</th><th>間隔</th><th>状態</th></tr></thead><tbody><tr th:each="target : ${targets}"><td class="cell-title" th:text="${target.name}">監視</td><td th:text="${target.targetType}">TCP</td><td class="mono" th:text="${target.host + ':' + (target.port != null ? target.port : '-')}">host</td><td class="mono" th:text="${target.oid != null ? target.oid : '-'}">-</td><td th:text="${target.intervalSeconds + ' 秒'}">60秒</td><td><span class="badge" th:classappend="${target.enabled ? 'normal' : 'closed'}" th:text="${target.enabled ? '有効' : '無効'}">有効</span></td></tr></tbody></table></div></section>
</main></body></html>
