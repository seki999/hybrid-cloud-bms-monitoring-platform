<!DOCTYPE html>
<!-- 协议历史页：按接收协议展示 Syslog 与 SNMP Trap 记录，用于比较入口流量并定位采集侧异常。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, ${historyType})}">
<head><title th:text="${historyTitle + ' | BMS Monitoring'}">受信履歴</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">PROTOCOL HISTORY</p><h1 th:text="${historyTitle}">Syslog受信履歴</h1><p class="lead">原文、解析値、標準化状態を失わず保存した受信記録</p></div><span class="subtle" th:text="${events.totalElements + ' RECORDS'}">30</span></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>受信日時</th><th>プロトコル</th><th>機器</th><th>メッセージ</th><th>Facility / Value</th><th>状態</th><th>原文</th></tr></thead><tbody><tr th:each="event : ${events.content}"><td class="mono" th:text="${#temporals.format(event.occurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</td><td><span class="badge maintenance" th:text="${event.protocol}">RFC3164</span></td><td th:text="${event.device != null ? event.device.name : '未登録'}">device</td><td><a class="cell-title truncate" th:href="@{/events/{id}(id=${event.id})}" th:text="${event.message}">message</a><span class="cell-sub mono" th:text="${event.eventKey}">key</span></td><td th:text="${event.metricValue != null ? event.metricValue : (event.facility != null ? event.facility : '-')}">local0</td><td><span class="badge" th:classappend="${#strings.toLowerCase(event.status.name())}" th:text="${event.status}">NORMAL</span></td><td class="mono truncate" th:text="${event.rawMessage}">raw</td></tr></tbody></table></div><div class="pagination"><span class="subtle" th:text="${'ページ ' + (events.number + 1)}">1</span><div class="pagination-links"><a class="page-link" th:classappend="${events.first} ? 'disabled'" th:href="${'/history/' + historyType + '?page=' + (events.number - 1)}">前へ</a><a class="page-link" th:classappend="${events.last} ? 'disabled'" th:href="${'/history/' + historyType + '?page=' + (events.number + 1)}">次へ</a></div></div></section>
</main></body></html>
