<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'events')}">
<head><title>イベント詳細 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">EVENT DETAIL</p><h1 th:text="${'イベント #' + event.id}">イベント #1</h1><p class="lead" th:text="${event.message}">message</p></div><a class="btn btn-secondary" th:href="@{/events}">一覧へ</a></div>
  <section class="panel"><div class="panel-head"><h2>正規化データ</h2><span class="badge" th:classappend="${#strings.toLowerCase(event.status.name())}" th:text="${event.status}">WARNING</span></div><div class="panel-body"><div class="detail-grid"><div class="detail-item"><span class="detail-label">SOURCE</span><span class="detail-value" th:text="${event.source}">SYSLOG</span></div><div class="detail-item"><span class="detail-label">SEVERITY</span><span class="detail-value" th:text="${event.severity}">WARNING</span></div><div class="detail-item"><span class="detail-label">PROTOCOL</span><span class="detail-value" th:text="${event.protocol}">RFC5424</span></div><div class="detail-item"><span class="detail-label">DEVICE</span><span class="detail-value" th:text="${event.device != null ? event.device.name : '未登録'}">device</span></div><div class="detail-item"><span class="detail-label">FACILITY</span><span class="detail-value" th:text="${event.facility != null ? event.facility : '-'}">local0</span></div><div class="detail-item"><span class="detail-label">発生日時</span><span class="detail-value" th:text="${#temporals.format(event.occurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</span></div><div class="detail-item"><span class="detail-label">EVENT KEY</span><span class="detail-value mono" th:text="${event.eventKey}">key</span></div><div class="detail-item"><span class="detail-label">METRIC VALUE</span><span class="detail-value" th:text="${event.metricValue != null ? event.metricValue : '-'}">-</span></div><div class="detail-item"><span class="detail-label">FINGERPRINT</span><span class="detail-value mono" th:text="${event.fingerprint}">hash</span></div></div><h3>受信原文</h3><pre class="raw-block mono" th:text="${event.rawMessage}">raw</pre></div></section>
</main></body></html>
