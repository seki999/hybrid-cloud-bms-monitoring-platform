<!DOCTYPE html>
<!-- 事件列表页：按协议、状态和关键字检索标准化监控事件，保留原始消息入口以支持故障追溯。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'events')}">
<head><title>イベント一覧 | BMS Monitoring</title></head>
<body><main>
  <div class="page-head"><div><p class="eyebrow">IMMUTABLE OBSERVATIONS</p><h1>イベント一覧</h1><p class="lead">各プロトコルから受信した単一の監視事実</p></div><span class="subtle" th:text="${events.totalElements + ' EVENTS'}">90 EVENTS</span></div>
  <section class="panel"><div class="panel-head"><form class="toolbar" method="get" th:action="@{/events}"><div class="search"><input name="q" th:value="${q}" placeholder="メッセージを検索"></div><button class="btn btn-secondary">検索</button></form></div><div class="table-wrap"><table><thead><tr><th>発生日時</th><th>ソース</th><th>機器</th><th>イベント内容</th><th>級別</th><th>状態</th><th>重複</th></tr></thead><tbody><tr th:each="event : ${events.content}"><td class="mono" th:text="${#temporals.format(event.occurredAt, 'yyyy/MM/dd HH:mm:ss')}">date</td><td><span class="badge maintenance" th:text="${event.source}">SYSLOG</span></td><td th:text="${event.device != null ? event.device.name : '未登録'}">device</td><td><a class="cell-title truncate" th:href="@{/events/{id}(id=${event.id})}" th:text="${event.message}">event</a><span class="cell-sub mono" th:text="${event.eventKey}">key</span></td><td th:text="${event.severity}">INFO</td><td><span class="badge" th:classappend="${#strings.toLowerCase(event.status.name())}" th:text="${event.status}">NORMAL</span></td><td th:text="${event.duplicate ? '抑止対象' : '-'}">-</td></tr></tbody></table></div><div class="pagination"><span class="subtle" th:text="${'ページ ' + (events.number + 1) + ' / ' + (events.totalPages == 0 ? 1 : events.totalPages)}">1</span><div class="pagination-links"><a class="page-link" th:classappend="${events.first} ? 'disabled'" th:href="@{/events(q=${q},page=${events.number - 1})}">前へ</a><a class="page-link" th:classappend="${events.last} ? 'disabled'" th:href="@{/events(q=${q},page=${events.number + 1})}">次へ</a></div></div></section>
</main></body></html>
